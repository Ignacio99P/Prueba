
<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Argentina TV</title>

  <!-- Shaka Player -->

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.compiled.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;

      border-bottom: 1px solid var(--border);

      display: flex;
      justify-content: space-between;
      align-items: center;

      flex-wrap: wrap;
      gap: 1rem;

      height: 70px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }

    .search-box {
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;

      padding: 0.5rem 1rem;

      border-radius: 8px;

      border: 1px solid var(--border);

      background-color: var(--bg-dark);

      color: var(--text-main);

      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    /* =========================================================
       CONTENEDOR
       ========================================================= */

    .container {
      display: flex;

      flex: 1;

      height: calc(100vh - 70px);

      overflow: hidden;
    }

    /* =========================================================
       SIDEBAR
       ========================================================= */

    .sidebar {
      width: 340px;

      background-color: var(--bg-card);

      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      height: 100%;

      flex-shrink: 0;
    }

    .channel-list {
      flex: 1;

      overflow-y: auto;

      list-style: none;
    }

    .channel-list::-webkit-scrollbar {
      width: 6px;
    }

    .channel-list::-webkit-scrollbar-track {
      background: var(--bg-card);
    }

    .channel-list::-webkit-scrollbar-thumb {
      background: var(--bg-hover);

      border-radius: 3px;
    }

    .channel-list::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* =========================================================
       CANALES
       ========================================================= */

    .channel-item {
      padding: 0.75rem 1rem;

      border-bottom: 1px solid var(--border);

      cursor: pointer;

      display: flex;

      align-items: center;

      gap: 0.75rem;

      transition: background 0.2s;
    }

    .channel-item:hover,
    .channel-item.active {
      background-color: var(--bg-hover);
    }

    .channel-logo {
      width: 30px;
      height: 30px;

      object-fit: contain;

      border-radius: 4px;

      background-color: rgba(255, 255, 255, 0.05);

      flex-shrink: 0;
    }

    .channel-name {
      font-size: 0.9rem;

      font-weight: 500;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    .main-content {
      flex: 1;

      display: flex;

      flex-direction: column;

      background-color: #000;

      height: 100%;

      overflow: hidden;
    }

    /* =========================================================
       PLAYER
       ========================================================= */

    .player-container {
      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      background-color: #000;

      overflow: hidden;

      position: relative;
    }

    video {
      width: 100%;
      height: 100%;

      max-height: 100%;

      object-fit: contain;

      background: #000;
    }

    /* =========================================================
       SHAKA CONTROLES
       ========================================================= */

    .video-wrapper {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;
    }

    /* =========================================================
       PLACEHOLDER
       ========================================================= */

    .placeholder {
      color: var(--text-muted);

      text-align: center;

      padding: 2rem;

      max-width: 600px;

      line-height: 1.6;
    }

    .loading {
      width: 42px;
      height: 42px;

      border: 4px solid var(--border);

      border-top-color: var(--primary);

      border-radius: 50%;

      animation: spin 1s linear infinite;

      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status {
      margin-top: 0.75rem;

      font-size: 0.8rem;

      color: var(--text-muted);
    }

    .status.error {
      color: var(--danger);
    }

    .status.ok {
      color: var(--success);
    }

    /* =========================================================
       INFO
       ========================================================= */

    .stream-info {
      background-color: var(--bg-card);

      padding: 1rem 1.5rem;

      border-top: 1px solid var(--border);

      flex-shrink: 0;
    }

    .stream-info h2 {
      font-size: 1rem;
    }

    .engine {
      margin-top: 0.35rem;

      font-size: 0.75rem;

      color: var(--text-muted);
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 768px) {

      html,
      body {
        overflow: auto;
      }

      .container {
        flex-direction: column-reverse;

        height: auto;

        overflow: visible;
      }

      .sidebar {
        width: 100%;

        height: 50vh;
      }

      .main-content {
        height: 50vh;

        position: sticky;

        top: 0;

        z-index: 10;
      }

    }
  </style>

</head>

<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header>

```
<div class="logo">
  🇦🇷 Argentina TV
</div>

<div class="search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="Buscar canal..."
  >

</div>
```

  </header>

  <!-- =========================================================
       CONTENEDOR
       ========================================================= -->

  <div class="container">

```
<!-- =======================================================
     SIDEBAR
     ======================================================= -->

<aside class="sidebar">

  <ul
    class="channel-list"
    id="channelList"
  >

    <li class="placeholder">
      Cargando lista de canales...
    </li>

  </ul>

</aside>


<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="main-content">

  <div
    class="player-container"
    id="playerContainer"
  >

    <div class="placeholder">

      Seleccioná un canal para reproducir.

    </div>

  </div>


  <div class="stream-info">

    <h2 id="currentChannelName">
      Ningún canal seleccionado
    </h2>

    <div
      class="engine"
      id="engineStatus"
    >
      Motor: Shaka Player
    </div>

  </div>

</main>
```

  </div>

  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    /* ===========================================================
       CONFIGURACIÓN
       =========================================================== */

    const M3U_URL =
      'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ar.m3u';


    /*
     * Cantidad de reintentos de Shaka.
     *
     * Esto es importante para los streams que tienen
     * segmentos que ocasionalmente fallan.
     */

    const RETRY_PARAMETERS = {

      maxAttempts: 8,

      baseDelay: 1000,

      backoffFactor: 1.5,

      fuzzFactor: 0.25,

      timeout: 15000,

      stallTimeout: 8000,

      connectionTimeout: 10000

    };


    /* ===========================================================
       VARIABLES
       =========================================================== */

    let channels = [];

    let player = null;

    let video = null;

    let currentChannel = null;

    let reconnectTimer = null;

    let reconnectAttempts = 0;

    let intentionalStop = false;


    /* ===========================================================
       ELEMENTOS
       =========================================================== */

    const channelList =
      document.getElementById(
        'channelList'
      );

    const playerContainer =
      document.getElementById(
        'playerContainer'
      );

    const currentChannelName =
      document.getElementById(
        'currentChannelName'
      );

    const engineStatus =
      document.getElementById(
        'engineStatus'
      );

    const searchInput =
      document.getElementById(
        'searchInput'
      );


    /* ===========================================================
       INICIALIZAR SHAKA
       =========================================================== */

    async function initShaka() {

      /*
       * Instalar polyfills recomendados por Shaka.
       */

      shaka.polyfill.installAll();


      /*
       * Comprobar compatibilidad.
       */

      if (!shaka.Player.isBrowserSupported()) {

        console.error(
          'Este navegador no es compatible con Shaka Player.'
        );

        showError(
          'Tu navegador no es compatible con Shaka Player.'
        );

        return false;
      }


      return true;

    }


    /* ===========================================================
       CARGAR PLAYLIST
       =========================================================== */

    async function loadM3UPlaylist() {

      try {

        const response =
          await fetch(
            M3U_URL,
            {
              cache: 'no-store'
            }
          );


        if (!response.ok) {

          throw new Error(
            'HTTP ' + response.status
          );

        }


        const text =
          await response.text();


        parseM3U(text);


        renderChannels();


        console.log(
          'Canales cargados:',
          channels.length
        );


      } catch (error) {

        console.error(
          'Error cargando M3U:',
          error
        );


        channelList.innerHTML = `

          <li class="placeholder">

            Error al obtener la lista
            de canales.

          </li>

        `;

      }

    }


    /* ===========================================================
       PARSER M3U
       =========================================================== */

    function parseM3U(data) {

      channels = [];


      const lines =
        data.split(/\r?\n/);


      let currentChannel = {};


      for (const originalLine of lines) {

        const line =
          originalLine.trim();


        /*
         * Información del canal.
         */

        if (
          line.startsWith('#EXTINF:')
        ) {

          const commaIndex =
            line.indexOf(',');


          const name =
            commaIndex !== -1

              ? line
                  .substring(
                    commaIndex + 1
                  )
                  .trim()

              : 'Canal sin nombre';


          const logoMatch =
            line.match(
              /tvg-logo="([^"]+)"/
            );


          const logo =
            logoMatch
              ? logoMatch[1]
              : '';


          currentChannel = {

            name,

            logo

          };

        }


        /*
         * URL del stream.
         */

        else if (
          line.startsWith(
            'http://'
          )
          ||
          line.startsWith(
            'https://'
          )
        ) {

          if (
            currentChannel.name
          ) {

            currentChannel.url =
              line;


            channels.push(
              currentChannel
            );


            currentChannel = {};

          }

        }

      }

    }


    /* ===========================================================
       RENDER CANALES
       =========================================================== */

    function renderChannels() {

      const searchTerm =
        searchInput.value
          .toLowerCase()
          .trim();


      channelList.innerHTML = '';


      const filtered =
        channels.filter(
          channel =>
            channel.name
              .toLowerCase()
              .includes(
                searchTerm
              )
        );


      if (!filtered.length) {

        channelList.innerHTML = `

          <li class="placeholder">

            No hay canales disponibles.

          </li>

        `;

        return;

      }


      filtered.forEach(
        channel => {

          const li =
            document.createElement(
              'li'
            );


          li.className =
            'channel-item';


          /*
           * Mantener activo el canal actual
           * después de filtrar.
           */

          if (
            currentChannel &&
            currentChannel.url ===
              channel.url
          ) {

            li.classList.add(
              'active'
            );

          }


          let logoHtml;


          if (channel.logo) {

            logoHtml = `

              <img
                class="channel-logo"
                src="${escapeHTML(
                  channel.logo
                )}"
                alt=""
                onerror="
                  this.style.display='none'
                "
              >

            `;

          } else {

            logoHtml = `

              <span
                style="
                  font-size:1.2rem;
                "
              >
                📺
              </span>

            `;

          }


          li.innerHTML = `

            ${logoHtml}

            <span class="channel-name">

              ${escapeHTML(
                channel.name
              )}

            </span>

          `;


          li.onclick =
            () =>
              playChannel(
                channel,
                li
              );


          channelList.appendChild(
            li
          );

        }
      );

    }


    /* ===========================================================
       BUSCADOR
       =========================================================== */

    searchInput.addEventListener(
      'input',
      renderChannels
    );


    /* ===========================================================
       REPRODUCIR CANAL
       =========================================================== */

    async function playChannel(
      channel,
      element
    ) {

      intentionalStop = true;


      /*
       * Cancelar cualquier reconexión
       * pendiente.
       */

      if (reconnectTimer) {

        clearTimeout(
          reconnectTimer
        );

        reconnectTimer = null;

      }


      /*
       * Destruir player anterior.
       */

      await destroyPlayer();


      intentionalStop = false;


      currentChannel =
        channel;


      reconnectAttempts = 0;


      /*
       * Marcar canal seleccionado.
       */

      document
        .querySelectorAll(
          '.channel-item'
        )
        .forEach(
          item =>
            item.classList.remove(
              'active'
            )
        );


      if (element) {

        element.classList.add(
          'active'
        );

      }


      currentChannelName.textContent =
        channel.name;


      /*
       * Crear reproductor.
       */

      await createPlayer(
        channel.url
      );

    }


    /* ===========================================================
       CREAR PLAYER
       =========================================================== */

    async function createPlayer(
      streamURL
    ) {

      /*
       * Crear contenedor.
       */

      playerContainer.innerHTML = `

        <div class="video-wrapper">

          <video
            id="video"
            controls
            autoplay
            playsinline
          ></video>

        </div>

      `;


      video =
        document.getElementById(
          'video'
        );


      /*
       * Crear instancia Shaka.
       */

      player =
        new shaka.Player(
          video
        );


      /*
       * Configuración de red.
       *
       * Shaka utiliza estos parámetros
       * para manifest y segmentos.
       */

      player.configure({

        manifest: {

          retryParameters:
            RETRY_PARAMETERS

        },

        streaming: {

          retryParameters:
            RETRY_PARAMETERS,


          /*
           * Mantener más datos en buffer
           * para soportar pequeños cortes.
           */

          bufferingGoal: 20,

          rebufferingGoal: 4,

          bufferBehind: 30,


          /*
           * Saltar pequeños huecos
           * entre segmentos.
           */

          gapDetectionThreshold: 0.5,


          /*
           * Permitir recuperación del
           * MediaSource cuando sea posible.
           */

          allowMediaSourceRecoveries:
            true,


          /*
           * Para HLS en vivo.
           */

          lowLatencyMode: false

        },

        abr: {

          enabled: true,

          defaultBandwidthEstimate:
            1000000,

          bandwidthUpgradeTarget:
            0.85,

          bandwidthDowngradeTarget:
            0.95

        }

      });


      /*
       * Eventos de error.
       */

      player.addEventListener(
        'error',
        onPlayerError
      );


      /*
       * Error de video HTML5.
       */

      video.addEventListener(
        'error',
        () => {

          console.error(
            'HTML5 video error:',
            video.error
          );

          scheduleReconnect(
            'Error del elemento de video'
          );

        }
      );


      /*
       * Detectar buffering.
       */

      video.addEventListener(
        'waiting',
        () => {

          setEngineStatus(
            'Buffering...',
            false
          );

        }
      );


      /*
       * Cuando vuelve a reproducir.
       */

      video.addEventListener(
        'playing',
        () => {

          reconnectAttempts = 0;

          setEngineStatus(
            'Shaka Player • Reproduciendo',
            true
          );

        }
      );


      try {

        setEngineStatus(
          'Conectando con el stream...',
          false
        );


        /*
         * Cargar manifest HLS.
         */

        await player.load(
          streamURL
        );


        /*
         * Reproducir.
         */

        await video.play();


        setEngineStatus(
          'Shaka Player • En vivo',
          true
        );


      } catch (error) {

        console.error(
          'Error cargando stream:',
          error
        );


        /*
         * Intentar reconexión.
         */

        scheduleReconnect(
          getErrorMessage(error)
        );

      }

    }


    /* ===========================================================
       ERROR SHAKA
       =========================================================== */

    function onPlayerError(event) {

      const error =
        event.detail;


      console.error(
        'Shaka Error:',
        error
      );


      /*
       * Algunos errores son recuperables.
       *
       * No eliminamos el canal de la lista
       * automáticamente.
       */

      if (
        error &&
        error.severity ===
          shaka.util.Error.Severity.CRITICAL
      ) {

        scheduleReconnect(
          getErrorMessage(error)
        );

      } else {

        setEngineStatus(
          'Problema temporal, intentando continuar...',
          false
        );

      }

    }


    /* ===========================================================
       RECONEXIÓN AUTOMÁTICA
       =========================================================== */

    function scheduleReconnect(
      reason
    ) {

      if (
        intentionalStop ||
        !currentChannel
      ) {

        return;

      }


      if (reconnectTimer) {

        return;

      }


      reconnectAttempts++;


      /*
       * Backoff progresivo.
       *
       * 2s
       * 3s
       * 4.5s
       * 6.75s
       * ...
       */

      const delay =
        Math.min(
          30000,
          2000 *
          Math.pow(
            1.5,
            reconnectAttempts - 1
          )
        );


      setEngineStatus(

        `Reconectando en ${Math.ceil(
          delay / 1000
        )} segundos...`,

        false

      );


      console.warn(
        'Reconexión:',
        reason,
        'en',
        delay,
        'ms'
      );


      reconnectTimer =
        setTimeout(
          async () => {

            reconnectTimer =
              null;


            if (
              !currentChannel ||
              intentionalStop
            ) {

              return;

            }


            await destroyPlayer();


            await createPlayer(
              currentChannel.url
            );

          },

          delay

        );

    }


    /* ===========================================================
       DESTRUIR PLAYER
       =========================================================== */

    async function destroyPlayer() {

      if (player) {

        try {

          await player.destroy();

        } catch (error) {

          console.warn(
            'Error destruyendo Shaka:',
            error
          );

        }

        player = null;

      }


      if (video) {

        try {

          video.pause();

          video.removeAttribute(
            'src'
          );

          video.load();

        } catch (error) {

          console.warn(
            error
          );

        }

        video = null;

      }


      playerContainer.innerHTML = `

        <div class="placeholder">

          Seleccioná un canal para reproducir.

        </div>

      `;

    }


    /* ===========================================================
       ESTADO
       =========================================================== */

    function setEngineStatus(
      text,
      ok
    ) {

      engineStatus.textContent =
        text;


      engineStatus.className =
        ok

          ? 'engine status ok'

          : 'engine status';

    }


    /* ===========================================================
       ERROR VISUAL
       =========================================================== */

    function showError(
      message
    ) {

      playerContainer.innerHTML = `

        <div class="placeholder">

          <div
            style="
              font-size:3rem;
              margin-bottom:1rem;
            "
          >
            ⚠️
          </div>

          <div>

            ${escapeHTML(
              message
            )}

          </div>

        </div>

      `;

    }


    /* ===========================================================
       OBTENER MENSAJE DE ERROR
       =========================================================== */

    function getErrorMessage(
      error
    ) {

      if (!error) {

        return 'Error desconocido';

      }


      if (
        error.code
      ) {

        return (
          'Shaka error ' +
          error.code
        );

      }


      if (
        error.message
      ) {

        return error.message;

      }


      return String(
        error
      );

    }


    /* ===========================================================
       ESCAPAR HTML
       =========================================================== */

    function escapeHTML(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* ===========================================================
       INICIO
       =========================================================== */

    async function start() {

      /*
       * Inicializar Shaka.
       */

      const supported =
        await initShaka();


      if (!supported) {

        return;

      }


      /*
       * Cargar canales.
       */

      await loadM3UPlaylist();

    }


    start();

  </script>

</body>
