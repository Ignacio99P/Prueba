<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Argentina TV</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

header {
    height: 64px;
    min-height: 64px;

    background: #151515;
    border-bottom: 1px solid #292929;

    display: flex;
    align-items: center;

    padding: 0 20px;
}

header h1 {
    margin: 0;

    font-size: 21px;
    font-weight: 600;
}

/* =========================
   CONTENEDOR
========================= */

.container {
    width: 100%;
    height: calc(100vh - 64px);

    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {

    width: 330px;
    min-width: 330px;

    background: #151515;

    border-right: 1px solid #292929;

    display: flex;
    flex-direction: column;
}

.search {

    padding: 12px;

    border-bottom: 1px solid #292929;
}

.search input {

    width: 100%;
    height: 40px;

    border: none;
    outline: none;

    border-radius: 7px;

    padding: 0 13px;

    background: #292929;

    color: white;

    font-size: 14px;
}

.search input::placeholder {
    color: #999;
}

/* =========================
   CANALES
========================= */

.channels {

    flex: 1;

    overflow-y: auto;
}

.channel {

    min-height: 54px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 8px 12px;

    cursor: pointer;

    border-bottom: 1px solid #222;

    transition: background .15s;
}

.channel:hover {
    background: #252525;
}

.channel.active {
    background: #343434;
}

.channel-logo {

    width: 42px;
    min-width: 42px;

    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
}

.channel-name {

    font-size: 14px;

    line-height: 18px;

    color: #eee;
}

/* =========================
   REPRODUCTOR
========================= */

.main {

    flex: 1;

    min-width: 0;
    min-height: 0;

    background: #000;
}

.player-container {

    width: 100%;
    height: 100%;

    position: relative;

    background: #000;

    display: flex;
    flex-direction: column;
}

/* =========================
   PLAYER
========================= */

.player {

    flex: 1;

    width: 100%;

    border: 0;

    background: #000;
}

/* =========================
   BARRA INFERIOR
========================= */

.player-bar {

    min-height: 58px;

    background: #111;

    border-top: 1px solid #292929;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px 14px;
}

.current-channel {

    flex: 1;

    min-width: 0;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 14px;

    color: #ddd;
}

.button {

    border: none;

    border-radius: 6px;

    padding: 9px 13px;

    background: #292929;

    color: white;

    cursor: pointer;

    font-size: 13px;

    text-decoration: none;

    white-space: nowrap;
}

.button:hover {

    background: #3b3b3b;
}

.button.primary {

    background: #444;
}

/* =========================
   MENSAJE INICIAL
========================= */

.welcome {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #000;

    color: #aaa;

    pointer-events: none;

    z-index: 2;
}

.welcome.hidden {
    display: none;
}

.welcome-icon {

    font-size: 55px;

    margin-bottom: 15px;
}

.welcome-title {

    font-size: 20px;

    color: #ddd;

    margin-bottom: 8px;
}

.welcome-text {

    font-size: 14px;

    color: #777;
}

/* =========================
   SCROLLBAR
========================= */

.channels::-webkit-scrollbar {
    width: 7px;
}

.channels::-webkit-scrollbar-track {
    background: #111;
}

.channels::-webkit-scrollbar-thumb {

    background: #444;

    border-radius: 5px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {

        width: 250px;
        min-width: 250px;
    }

    .channel-name {

        font-size: 13px;
    }

    .player-bar {

        padding: 8px;
    }

    .button {

        padding: 8px;
    }
}

</style>

const channelsContainer =
    document.getElementById("channels");

const search =
    document.getElementById("search");

const player =
    document.getElementById("player");

const currentChannel =
    document.getElementById("currentChannel");

const externalButton =
    document.getElementById("externalButton");

const welcome =
    document.getElementById("welcome");


/* ============================================================
   URL DEL REPRODUCTOR EXTERNO
============================================================ */

/*
 * M3U8 Player Online ofrece un endpoint de iframe
 * que recibe la URL del M3U8 mediante ?url=
 *
 * La URL original se codifica para evitar problemas
 * con caracteres especiales.
 */

function getPlayerUrl(streamUrl) {

    return (
        "https://www.m3u8player.online/embed/m3u8?url=" +
        encodeURIComponent(streamUrl) +
        "&autoplay=true&muted=false&controls=true"
    );

}


/* ============================================================
   REPRODUCIR
============================================================ */

function playChannel(channel) {

    const name = channel[0];

    const streamUrl = channel[1];


    /*
     * Marcar canal activo
     */

    document
        .querySelectorAll(".channel")
        .forEach(element => {

            element.classList.remove("active");

        });


    const selected =
        document.querySelector(
            '[data-channel="' +
            CSS.escape(name) +
            '"]'
        );


    if (selected) {
        selected.classList.add("active");
    }


    /*
     * Mostrar nombre
     */

    currentChannel.textContent =
        "📺 " + name;


    /*
     * Construir reproductor externo
     */

    const playerUrl =
        getPlayerUrl(streamUrl);


    /*
     * Cargar iframe
     */

    player.src = playerUrl;


    /*
     * Botón para abrirlo fuera de GitHub Pages
     */

    externalButton.href =
        playerUrl;


    /*
     * Ocultar pantalla inicial
     */

    welcome.classList.add("hidden");

}


/* ============================================================
   CREAR LISTA
============================================================ */

function renderChannels(list) {

    channelsContainer.innerHTML = "";


    list.forEach(channel => {

        const item =
            document.createElement("div");


        item.className =
            "channel";


        item.dataset.channel =
            channel[0];


        const logo =
            document.createElement("div");


        logo.className =
            "channel-logo";


        logo.textContent =
            "📺";


        const name =
            document.createElement("div");


        name.className =
            "channel-name";


        name.textContent =
            channel[0];


        item.appendChild(logo);

        item.appendChild(name);


        item.addEventListener(
            "click",
            () => {

                playChannel(channel);

            }
        );


        channelsContainer.appendChild(item);

    });

}


/* ============================================================
   BUSCADOR
============================================================ */

search.addEventListener(
    "input",
    () => {

        const value =
            search.value
                .toLowerCase()
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                );


        const filtered =
            channels.filter(channel => {

                const name =
                    channel[0]
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(
                            /[\u0300-\u036f]/g,
                            ""
                        );


                return name.includes(value);

            });


        renderChannels(filtered);

    }
);


/* ============================================================
   INICIO
============================================================ */

renderChannels(channels);
