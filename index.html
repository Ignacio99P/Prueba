/* ============================================================

const video = document.getElementById("video");
const channelsContainer = document.getElementById("channels");
const search = document.getElementById("search");
const status = document.getElementById("status");

let hls = null;
let currentChannel = null;
let reconnectTimer = null;
let reconnectCount = 0;


/* ============================================================
   LISTA DE CANALES
============================================================ */

function renderChannels(list) {

    channelsContainer.innerHTML = "";

    list.forEach((channel) => {

        const item = document.createElement("div");

        item.className = "channel";

        item.dataset.name = channel[0];

        const logo = document.createElement("div");

        logo.className = "channel-logo";

        /*
         * No dependemos de logos externos.
         * De esta manera la lista siempre aparece.
         */

        logo.innerHTML = "📺";

        const name = document.createElement("div");

        name.className = "channel-name";

        name.textContent = channel[0];

        item.appendChild(logo);
        item.appendChild(name);

        item.addEventListener("click", () => {

            document
                .querySelectorAll(".channel")
                .forEach(el => el.classList.remove("active"));

            item.classList.add("active");

            playChannel(channel);

        });

        channelsContainer.appendChild(item);

    });
}


/* ============================================================
   REPRODUCIR CANAL
============================================================ */

function playChannel(channel) {

    currentChannel = channel;

    reconnectCount = 0;

    if (reconnectTimer) {

        clearTimeout(reconnectTimer);
        reconnectTimer = null;

    }

    destroyPlayer();

    status.className = "status";
    status.textContent = "Conectando con " + channel[0] + "...";


    /*
     * HLS.JS
     */

    if (Hls.isSupported()) {

        hls = new Hls({

            enableWorker: true,

            lowLatencyMode: false,

            backBufferLength: 30,

            maxBufferLength: 30,

            maxMaxBufferLength: 60,

            liveSyncDurationCount: 3,

            liveMaxLatencyDurationCount: 6,

            manifestLoadingTimeOut: 15000,

            manifestLoadingMaxRetry: 4,

            manifestLoadingRetryDelay: 1000,

            levelLoadingTimeOut: 15000,

            levelLoadingMaxRetry: 4,

            levelLoadingRetryDelay: 1000,

            fragLoadingTimeOut: 15000,

            fragLoadingMaxRetry: 4,

            fragLoadingRetryDelay: 1000

        });


        hls.attachMedia(video);


        hls.on(Hls.Events.MEDIA_ATTACHED, () => {

            hls.loadSource(channel[1]);

        });


        hls.on(Hls.Events.MANIFEST_PARSED, () => {

            status.textContent = channel[0];

            video.play().catch(() => {});

        });


        hls.on(Hls.Events.ERROR, (event, data) => {

            console.log(
                "HLS ERROR:",
                data.type,
                data.details,
                data
            );


            if (!data.fatal) {

                return;

            }


            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                status.className = "status";
                status.textContent =
                    "Problema de red. Reconectando...";

                reconnect();

            }

            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                status.className = "status";
                status.textContent =
                    "Recuperando reproducción...";

                try {

                    hls.recoverMediaError();

                } catch (e) {

                    reconnect();

                }

            }

            else {

                status.className = "status error";
                status.textContent =
                    "No se pudo reproducir el canal. Reintentando...";

                reconnect();

            }

        });

    }


    /*
     * HLS NATIVO
     */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = channel[1];

        video.addEventListener(
            "loadedmetadata",
            () => {

                status.textContent = channel[0];

                video.play().catch(() => {});

            },
            { once: true }
        );


        video.addEventListener(
            "error",
            () => {

                reconnect();

            },
            { once: true }
        );

    }

    else {

        status.className = "status error";

        status.textContent =
            "Tu navegador no soporta HLS.";

    }

}


/* ============================================================
   DESTRUIR REPRODUCTOR
============================================================ */

function destroyPlayer() {

    if (hls) {

        try {
            hls.destroy();
        } catch (e) {}

        hls = null;

    }

    video.pause();

    video.removeAttribute("src");

    video.load();

}


/* ============================================================
   RECONEXIÓN
============================================================ */

function reconnect() {

    if (!currentChannel) {
        return;
    }

    if (reconnectTimer) {
        return;
    }

    reconnectCount++;

    /*
     * 2s
     * 3s
     * 4s
     * ...
     * máximo 10s
     */

    const delay =
        Math.min(
            10000,
            1000 + reconnectCount * 1000
        );


    status.className = "status";

    status.textContent =
        "Reintentando " +
        currentChannel[0] +
        "...";


    reconnectTimer = setTimeout(() => {

        reconnectTimer = null;

        if (currentChannel) {

            playChannelWithoutReset(
                currentChannel
            );

        }

    }, delay);

}

                        return;

                    } catch (e) {}

                }


                reconnect();

            }
        );

    }

}


/* ============================================================
   DETECCIÓN DE VIDEO CONGELADO
============================================================ */

let lastTime = 0;
let lastProgress = Date.now();

setInterval(() => {

    if (!currentChannel) {
        return;
    }

    if (video.paused) {
        return;
    }

    const time = video.currentTime;


    if (
        Number.isFinite(time) &&
        time !== lastTime
    ) {

        lastTime = time;

        lastProgress = Date.now();

        /*
         * Si lleva funcionando bien,
         * reiniciamos el contador de reconexiones.
         */

        if (
            Date.now() - lastProgress < 5000
        ) {

            reconnectCount = 0;

        }

        status.className = "status";

        status.textContent =
            currentChannel[0];

    }


    /*
     * Más de 20 segundos sin avanzar
     */

    if (
        Date.now() - lastProgress > 20000
    ) {

        console.log(
            "STREAM DETENIDO. RECONEXIÓN."
        );

        lastProgress = Date.now();

        reconnect();

    }

}, 3000);


/* ============================================================
   BUSCADOR
============================================================ */

search.addEventListener(
    "input",
    () => {

        const text =
            search.value
                .toLowerCase()
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                );


        const filtered =
            channels.filter(channel => {

                const name =
                    channel[0]
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(
                            /[\u0300-\u036f]/g,
                            ""
                        );

                return name.includes(text);

            });


        renderChannels(filtered);

    }
);


/* ============================================================
   INICIO
============================================================ */

renderChannels(channels);

</script>
