<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      height: 70px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex: 1;
      max-width: 600px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-dark);
      color: var(--text-main);
      outline: none;
    }

    .file-input-btn {
      background: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: background 0.2s;
    }

    .channel-item:hover, .channel-item.active {
      background-color: var(--bg-hover);
    }

    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
      height: 100%;
      overflow: hidden;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .stream-info {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .container { flex-direction: column-reverse; height: auto; overflow: visible; }
      .sidebar { width: 100%; height: 50vh; }
      .main-content { height: 50vh; position: sticky; top: 0; z-index: 10; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">📺 IPTV Player</div>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
      </div>
      <label class="file-input-btn">
        📁 Cargar .M3U8
        <input type="file" id="fileInput" accept=".m3u,.m3u8" style="display:none" onchange="handleFileSelect(event)">
      </label>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <ul class="channel-list" id="channelList">
        <li class="placeholder">Intentando obtener lista remota...</li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="player-container" id="playerContainer">
        <div class="placeholder">Seleccioná un canal para reproducir.</div>
      </div>
      <div class="stream-info">
        <h2 id="currentChannelName">Ningún canal seleccionado</h2>
      </div>
    </main>
  </div>

  <script>
    const PLAYLIST_URL = 'http://200.62.239.170:830/playlist.m3u8';
    const BASE_URL = 'http://200.62.239.170:830/';

    let channels = [];
    let hlsInstance = null;

    async function loadM3UPlaylist() {
      try {
        // Intento de descarga usando Proxy de formato JSON
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(PLAYLIST_URL)}`;
        const response = await fetch(proxyUrl);
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        if (!data.contents) throw new Error("No se pudo obtener el contenido");

        channels = parseM3U(data.contents, BASE_URL);
        renderChannels();

        if (!channels.length) {
          throw new Error('Lista vacía');
        }
      } catch (error) {
        console.warn('Fallo la descarga remota:', error);
        document.getElementById('channelList').innerHTML = `
          <li class="placeholder">
            No se pudo cargar la lista remota desde el servidor.<br><br>
            <strong>Solución:</strong> Descarga el archivo <code>playlist.m3u8</code> en tu dispositivo y usa el botón <strong>"📁 Cargar .M3U8"</strong> arriba.
          </li>`;
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        channels = parseM3U(content, BASE_URL);
        renderChannels();
      };
      reader.readAsText(file);
    }

    function parseM3U(data, baseUrl) {
      const parsed = [];
      const lines = data.split(/\r?\n/);
      let currentChannel = {};

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const commaIndex = line.indexOf(',');
          const name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Canal sin nombre';
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const logo = logoMatch ? logoMatch[1] : '';
          currentChannel = { name, logo };
        } else if (line && !line.startsWith('#')) {
          let streamUrl = line;
          if (!/^https?:\/\//i.test(streamUrl)) {
            streamUrl = new URL(streamUrl, baseUrl).href;
          }
          if (currentChannel.name) {
            currentChannel.url = streamUrl;
            parsed.push(currentChannel);
            currentChannel = {};
          }
        }
      });
      return parsed;
    }

    function renderChannels() {
      const listElement = document.getElementById('channelList');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      listElement.innerHTML = '';

      const filtered = channels.filter(channel => channel.name.toLowerCase().includes(searchTerm));

      if (filtered.length === 0) {
        listElement.innerHTML = '<li class="placeholder">No hay canales disponibles.</li>';
        return;
      }

      filtered.forEach(channel => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        
        const logoHtml = channel.logo 
          ? `<img class="channel-logo" src="${channel.logo}" alt="" width="24" height="24" onerror="this.style.display='none'">` 
          : `<span style="font-size: 1.2rem;">📺</span>`;

        li.innerHTML = `${logoHtml}<span class="channel-name">${channel.name}</span>`;
        li.onclick = () => playChannel(channel, li);
        listElement.appendChild(li);
      });
    }

    function filterChannels() {
      renderChannels();
    }

    function playChannel(channel, element) {
      document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
      if (element) element.classList.add('active');

      document.getElementById('currentChannelName').textContent = channel.name;
      const container = document.getElementById('playerContainer');
      container.innerHTML = '';

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      const video = document.createElement('video');
      video.controls = true;
      video.autoplay = true;
      container.appendChild(video);

      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(channel.url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play();
      }
    }

    loadM3UPlaylist();
  </script>
</body>
</html>
