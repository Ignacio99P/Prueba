<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argentina TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-dark);
      color: var(--text-main);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .filter-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      border-bottom: 2px solid transparent;
    }

    .filter-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .channel-item:hover, .channel-item.active {
      background-color: var(--bg-hover);
    }

    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }

    .channel-badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4rem;
      background-color: var(--bg-dark);
      color: var(--text-muted);
      font-weight: bold;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
      max-height: 100%;
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .stream-info {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .open-btn {
      background-color: var(--primary);
      color: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
        height: auto;
        overflow: visible;
      }
      .sidebar {
        width: 100%;
        height: 400px;
      }
      .player-container {
        height: 56.25vw;
        flex: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🇦🇷 Argentina TV</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="setCategory('ALL', this)">TODOS</button>
        <button class="filter-btn" onclick="setCategory('TDA', this)">NACIONALES / TDA</button>
        <button class="filter-btn" onclick="setCategory('BSAS', this)">BUENOS AIRES</button>
      </div>
      <ul class="channel-list" id="channelList"></ul>
    </aside>

    <main class="main-content">
      <div class="player-container" id="playerContainer">
        <div class="placeholder">Seleccioná un canal de la lista para empezar a ver.</div>
      </div>
      <div class="stream-info">
        <h2 id="currentChannelName">Ningún canal seleccionado</h2>
        <a id="externalLink" href="#" target="_blank" class="open-btn" style="display:none;">Abrir en fuente externa ↗</a>
      </div>
    </main>
  </div>

  <script>
    // Lista extraída directamente del repositorio
    const rawChannels = [
      // NACIONALES / TDA
      { name: "TN Todo Noticias", url: "https://www.youtube.com/embed/live_stream?channel=UC2icp488Tzrt1UThR-8v07A", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/user/todonoticias" },
      { name: "Encuentro", url: "https://www.youtube.com/embed/live_stream?channel=UC8V0O093YnK5Cq3uB-T30oQ", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/user/canalencuentro" },
      { name: "Pakapaka", url: "https://www.youtube.com/embed/live_stream?channel=UCU9891EFLc9t-J1BgtM9a6A", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/user/CanalPakapaka" },
      { name: "Televisión Pública", url: "https://www.youtube.com/embed/live_stream?channel=UC1vA9wP06LAt4v70T6cT4bQ", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/user/TVPublicaArgentina" },
      { name: "Canal 26", url: "https://www.youtube.com/embed/live_stream?channel=UC8SAtxX6C-zV-SgDTh5Qxng", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/user/canal26" },
      { name: "Crónica TV", url: "https://www.youtube.com/embed/live_stream?channel=UC4SjPmsM1L9A8f1aT1X2-fA", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/c/cronicatv" },
      { name: "IP Noticias", url: "https://www.youtube.com/embed/live_stream?channel=UC3O30E78S0vE65R76B4M1bg", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/c/IPNoticias" },
      { name: "El Destape", url: "https://www.youtube.com/embed/live_stream?channel=UCW8sIqE58-wO-RzF_w1z8gA", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/c/ElDestape" },
      { name: "C5N", url: "https://www.youtube.com/embed/live_stream?channel=UC_1mI24zTq0E3V36mE75w6A", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/c/c5n" },
      { name: "LN+", url: "https://www.youtube.com/embed/live_stream?channel=UCba3h_8-g-U8fL7N5wU7s8g", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/c/LaNacionPlus" },
      { name: "Canal E", url: "https://www.youtube.com/embed/live_stream?channel=UC0O81B7tT4O_v9K4x7-X4-Q", group: "TDA", isYT: true, origUrl: "https://www.youtube.com/c/CanalE" },
      
      // BUENOS AIRES
      { name: "Telefe", url: "https://www.youtube.com/embed/live_stream?channel=UC7w_yA2zX4s2vFjH9G67-fg", group: "BSAS", isYT: true, origUrl: "https://www.youtube.com/user/telefe" },
      { name: "América TV", url: "https://www.youtube.com/embed/live_stream?channel=UCs3zX915R53f7c46aIeL2aA", group: "BSAS", isYT: true, origUrl: "https://www.youtube.com/user/americatv" },
      { name: "A24", url: "https://www.youtube.com/embed/live_stream?channel=UC_7oM4L8K9S-5vYtI4Xv_Xg", group: "BSAS", isYT: true, origUrl: "https://www.youtube.com/user/a24com" },
      { name: "Telemax", url: "https://stream.telecentro.com.ar/hls/telemax/index.m3u8", group: "BSAS", isYT: false, origUrl: "https://stream.telecentro.com.ar/hls/telemax/index.m3u8" },
      { name: "Net TV", url: "https://www.canalnet.tv/vivo/", group: "BSAS", isYT: false, origUrl: "https://www.canalnet.tv/vivo/" },
      { name: "El Trece", url: "https://www.eltrece.tv/vivo", group: "BSAS", isYT: false, origUrl: "https://www.eltrece.tv/vivo" },
      { name: "El Nueve", url: "https://www.elnueve.com.ar/en-vivo", group: "BSAS", isYT: false, origUrl: "https://www.elnueve.com.ar/en-vivo" }
    ];

    let currentCategory = 'ALL';
    let hlsInstance = null;

    function renderChannels() {
      const listElement = document.getElementById('channelList');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      listElement.innerHTML = '';

      const filtered = rawChannels.filter(channel => {
        const matchesCategory = currentCategory === 'ALL' || channel.group === currentCategory;
        const matchesSearch = channel.name.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        listElement.innerHTML = '<li class="placeholder">No se encontraron canales.</li>';
        return;
      }

      filtered.forEach(channel => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        const badge = channel.isYT ? '<span class="channel-badge">YT</span>' : '';
        li.innerHTML = `<span class="channel-name">📺 ${channel.name}</span>${badge}`;
        li.onclick = () => playChannel(channel, li);
        listElement.appendChild(li);
      });
    }

    function setCategory(category, button) {
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      renderChannels();
    }

    function filterChannels() {
      renderChannels();
    }

    function playChannel(channel, element) {
      document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
      if (element) element.classList.add('active');

      document.getElementById('currentChannelName').textContent = channel.name;
      const externalBtn = document.getElementById('externalLink');
      externalBtn.style.display = 'inline-block';
      externalBtn.href = channel.origUrl;

      const container = document.getElementById('playerContainer');
      container.innerHTML = '';

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (channel.isYT) {
        container.innerHTML = `<iframe src="${channel.url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      } else if (channel.url.endsWith('.m3u8')) {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        container.appendChild(video);

        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(channel.url);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = channel.url;
          video.play();
        }
      } else {
        // Para canales que bloquean iframe por CORS/seguridad (El Trece, El Nueve, Net TV)
        container.innerHTML = `
          <div class="placeholder">
            <p>Este canal restringe la reproducción dentro de sitios de terceros.</p><br>
            <a href="${channel.origUrl}" target="_blank" class="open-btn">Abrir señal oficial de ${channel.name} ↗</a>
          </div>`;
      }
    }

    // Cargar al iniciar
    renderChannels();
  </script>
</body>
</html>
