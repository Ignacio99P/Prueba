<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player Bypass</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --primary: #f97316;
      --text-main: #f8fafc;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
    header { background: var(--bg-card); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: #fff; }
    button { background: var(--primary); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .player-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <header>
    <input type="text" id="streamUrl" placeholder="Ej: http://200.62.239.170:830/play/a00p/index.m3u8">
    <button onclick="playStream()">▶ Reproducir</button>
  </header>

  <div class="player-container" id="playerContainer">
    <p style="color: #94a3b8;">Pega el enlace del canal arriba para iniciar la transmisión.</p>
  </div>

  <script>
    const PROXY = 'https://corsproxy.io/?';
    let hlsInstance = null;

    function playStream() {
      const input = document.getElementById('streamUrl').value.trim();
      if (!input) return;

      const container = document.getElementById('playerContainer');
      container.innerHTML = '';

      if (hlsInstance) hlsInstance.destroy();

      const video = document.createElement('video');
      video.controls = true;
      video.autoplay = true;
      container.appendChild(video);

      // Si la URL es HTTP, la enviamos a través del proxy CORS
      const targetUrl = input.startsWith('http://') ? PROXY + encodeURIComponent(input) : input;

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          xhrSetup: function(xhr, url) {
            // Reenruta sub-peticiones de manifiestos y fragmentos .ts si son HTTP
            if (url.startsWith('http://')) {
              xhr.open('GET', PROXY + encodeURIComponent(url), true);
            }
          }
        });
        hlsInstance.loadSource(targetUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = targetUrl;
        video.play();
      }
    }
  </script>
</body>
</html>
