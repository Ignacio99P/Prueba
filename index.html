<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argentina TV</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      height: 70px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }

    .search-box {
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-dark);
      color: var(--text-main);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-list::-webkit-scrollbar {
      width: 6px;
    }
    .channel-list::-webkit-scrollbar-track {
      background: var(--bg-card);
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 3px;
    }

    .channel-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: background 0.2s;
    }

    .channel-item:hover, .channel-item.active {
      background-color: var(--bg-hover);
    }

    .channel-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
      height: 100%;
      overflow: hidden;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .stream-info {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .container { flex-direction: column-reverse; height: auto; overflow: visible; }
      .sidebar { width: 100%; height: 50vh; }
      .main-content { height: 50vh; position: sticky; top: 0; z-index: 10; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🇦🇷 Argentina TV</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <ul class="channel-list" id="channelList">
        <li class="placeholder">Cargando lista de canales...</li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="player-container" id="playerContainer">
        <!-- Reproductor incrustado inicial -->
        <iframe 
          id="externalPlayerFrame"
          src="https://hlsjs.videojs.org/demo/?src=http%3A%2F%2F200.62.239.170%3A830%2Fplay%2Fa00p%2Findex.m3u8"
          allow="autoplay; encrypted-media; fullscreen"
          allowfullscreen>
        </iframe>
      </div>
      <div class="stream-info">
        <h2 id="currentChannelName">ESPN Premium Argentina (Servidor 200.62)</h2>
      </div>
    </main>
  </div>

  <script>
    const M3U_URLS = [
      'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ar.m3u'
    ];

    // Canales del servidor intermedio configurados con el web player embebido
    const EXTRA_CHANNELS = [
      { 
        name: 'ESPN Premium Argentina (200.62)', 
        logo: '', 
        url: 'http://200.62.239.170:830/play/a00p/index.m3u8' 
      }
    ];

    let channels = [];

    async function loadM3UPlaylist() {
      try {
        const results = await Promise.allSettled(
          M3U_URLS.map(async (url) => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return parseM3U(await response.text());
          })
        );

        const loaded = results
          .filter(result => result.status === 'fulfilled')
          .flatMap(result => result.value);

        channels = deduplicateChannels([...EXTRA_CHANNELS, ...loaded]);
        renderChannels();
      } catch (error) {
        channels = EXTRA_CHANNELS;
        renderChannels();
      }
    }

    function parseM3U(data) {
      const parsed = [];
      const lines = data.split(/\r?\n/);
      let currentChannel = {};

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const commaIndex = line.indexOf(',');
          const name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Canal sin nombre';
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const logo = logoMatch ? logoMatch[1] : '';
          currentChannel = { name, logo };
        } else if (line && !line.startsWith('#')) {
          if (/^https?:\/\//i.test(line) && currentChannel.name) {
            currentChannel.url = line;
            parsed.push(currentChannel);
            currentChannel = {};
          }
        }
      });
      return parsed;
    }

    function deduplicateChannels(list) {
      const seen = new Set();
      return list.filter(channel => {
        const key = `${channel.name.toLowerCase()}|${channel.url}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function renderChannels() {
      const listElement = document.getElementById('channelList');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      listElement.innerHTML = '';

      const filtered = channels.filter(channel => channel.name.toLowerCase().includes(searchTerm));

      if (filtered.length === 0) {
        listElement.innerHTML = '<li class="placeholder">No hay canales disponibles.</li>';
        return;
      }

      filtered.forEach((channel, index) => {
        const li = document.createElement('li');
        li.className = `channel-item ${index === 0 ? 'active' : ''}`;
        
        const logoHtml = channel.logo 
          ? `<img class="channel-logo" src="${channel.logo}" alt="" onerror="this.style.display='none'">` 
          : `<span style="font-size: 1.2rem;">📺</span>`;

        li.innerHTML = `${logoHtml}<span class="channel-name">${channel.name}</span>`;
        li.onclick = () => playChannel(channel, li);
        listElement.appendChild(li);
      });
    }

    function filterChannels() {
      renderChannels();
    }

    function playChannel(channel, element) {
      document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
      if (element) element.classList.add('active');

      document.getElementById('currentChannelName').textContent = channel.name;

      const iframe = document.getElementById('externalPlayerFrame');
      
      // Codifica la URL del canal para enviarla al reproductor web externo del iframe
      const playerUrl = `https://hlsjs.videojs.org/demo/?src=${encodeURIComponent(channel.url)}`;
      iframe.src = playerUrl;
    }

    loadM3UPlaylist();
  </script>
</body>
</html>
