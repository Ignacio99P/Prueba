<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argentina TV - FFmpeg WASM</title>

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-card);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      height: 70px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
      white-space: nowrap;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      color: var(--text-main);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-list::-webkit-scrollbar {
      width: 6px;
    }

    .channel-list::-webkit-scrollbar-track {
      background: var(--bg-card);
    }

    .channel-list::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 3px;
    }

    .channel-list::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    .channel-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: background 0.2s;
    }

    .channel-item:hover,
    .channel-item.active {
      background: var(--bg-hover);
    }

    .channel-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      height: 100%;
      overflow: hidden;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
      max-width: 600px;
      line-height: 1.6;
    }

    .status {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status.error {
      color: var(--danger);
    }

    .stream-info {
      background: var(--bg-card);
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .stream-info h2 {
      font-size: 1rem;
    }

    .engine {
      margin-top: 0.35rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .loading {
      width: 42px;
      height: 42px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      html,
      body {
        overflow: auto;
      }

      .container {
        flex-direction: column-reverse;
        height: auto;
        overflow: visible;
      }

      .sidebar {
        width: 100%;
        height: 50vh;
      }

      .main-content {
        height: 50vh;
        position: sticky;
        top: 0;
        z-index: 10;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="logo">🇦🇷 Argentina TV</div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Buscar canal..."
      oninput="filterChannels()"
    >
  </div>
</header>

<div class="container">

  <aside class="sidebar">

```
<ul class="channel-list" id="channelList">
  <li class="placeholder">
    Cargando lista de canales...
  </li>
</ul>
```

  </aside>

  <main class="main-content">

```
<div class="player-container" id="playerContainer">

  <div class="placeholder">
    <div class="loading"></div>

    <div>
      Inicializando reproductor FFmpeg WebAssembly...
    </div>

    <div class="status" id="playerStatus">
      Preparando motor multimedia...
    </div>
  </div>

</div>

<div class="stream-info">

  <h2 id="currentChannelName">
    Ningún canal seleccionado
  </h2>

  <div class="engine">
    Motor: FFmpeg WebAssembly
  </div>

</div>
```

  </main>

</div>

<script type="module">

/*
 * ============================================================
 * CONFIGURACIÓN
 * ============================================================
 */

const M3U_URL =
  'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ar.m3u';


/*
 * ============================================================
 * VARIABLES
 * ============================================================
 */

let channels = [];

let currentChannel = null;

let currentObjectURL = null;


/*
 * ============================================================
 * ELEMENTOS
 * ============================================================
 */

const channelList =
  document.getElementById('channelList');

const playerContainer =
  document.getElementById('playerContainer');

const currentChannelName =
  document.getElementById('currentChannelName');

const playerStatus =
  document.getElementById('playerStatus');


/*
 * ============================================================
 * CARGAR LISTA M3U
 * ============================================================
 */

async function loadM3UPlaylist() {

  try {

    const response =
      await fetch(M3U_URL, {
        cache: 'no-store'
      });

    if (!response.ok) {
      throw new Error(
        'No se pudo descargar la lista M3U'
      );
    }

    const text =
      await response.text();

    parseM3U(text);

    renderChannels();

    setStatus(
      'Lista de canales cargada.',
      false
    );

  } catch (error) {

    console.error(error);

    channelList.innerHTML = `
      <li class="placeholder">
        Error al obtener la lista de canales.
      </li>
    `;

    setStatus(
      'No se pudo cargar la lista de canales.',
      true
    );

  }

}


/*
 * ============================================================
 * PARSER M3U
 * ============================================================
 */

function parseM3U(data) {

  channels = [];

  const lines =
    data.split(/\r?\n/);

  let currentChannel = {};

  for (const originalLine of lines) {

    const line =
      originalLine.trim();

    if (line.startsWith('#EXTINF:')) {

      const commaIndex =
        line.indexOf(',');

      const name =
        commaIndex !== -1
          ? line
              .substring(commaIndex + 1)
              .trim()
          : 'Canal sin nombre';

      const logoMatch =
        line.match(
          /tvg-logo="([^"]+)"/
        );

      const logo =
        logoMatch
          ? logoMatch[1]
          : '';

      currentChannel = {
        name,
        logo
      };

    }

    else if (
      line.startsWith('http://') ||
      line.startsWith('https://')
    ) {

      if (currentChannel.name) {

        currentChannel.url =
          line;

        channels.push(
          currentChannel
        );

        currentChannel = {};

      }

    }

  }

}


/*
 * ============================================================
 * RENDER CANALES
 * ============================================================
 */

function renderChannels() {

  const searchTerm =
    document
      .getElementById('searchInput')
      .value
      .toLowerCase()
      .trim();

  channelList.innerHTML = '';

  const filtered =
    channels.filter(channel =>
      channel.name
        .toLowerCase()
        .includes(searchTerm)
    );

  if (!filtered.length) {

    channelList.innerHTML = `
      <li class="placeholder">
        No hay canales disponibles.
      </li>
    `;

    return;
  }

  filtered.forEach(channel => {

    const li =
      document.createElement('li');

    li.className =
      'channel-item';

    if (
      currentChannel &&
      currentChannel.url === channel.url
    ) {
      li.classList.add('active');
    }

    const logoHtml =
      channel.logo

        ? `
          <img
            class="channel-logo"
            src="${escapeHTML(channel.logo)}"
            alt=""
            onerror="this.style.display='none'"
          >
        `

        : `
          <span style="font-size:1.2rem;">
            📺
          </span>
        `;

    li.innerHTML = `
      ${logoHtml}
      <span class="channel-name">
        ${escapeHTML(channel.name)}
      </span>
    `;

    li.onclick =
      () => playChannel(channel, li);

    channelList.appendChild(li);

  });

}


/*
 * ============================================================
 * BUSCADOR
 * ============================================================
 */

function filterChannels() {
  renderChannels();
}


/*
 * ============================================================
 * REPRODUCTOR
 * ============================================================
 */

async function playChannel(channel, element) {

  currentChannel =
    channel;

  document
    .querySelectorAll('.channel-item')
    .forEach(item =>
      item.classList.remove('active')
    );

  if (element) {
    element.classList.add('active');
  }

  currentChannelName.textContent =
    channel.name;

  destroyCurrentPlayer();

  playerContainer.innerHTML = `
    <div class="placeholder">

      <div class="loading"></div>

      <div>
        Preparando FFmpeg WebAssembly...
      </div>

      <div
        class="status"
        id="playerStatus"
      >
        Analizando stream...
      </div>

    </div>
  `;

  try {

    /*
     * --------------------------------------------------------
     * IMPORTANTE
     * --------------------------------------------------------
     *
     * FFmpeg.wasm no funciona como HLS.js.
     *
     * Esta función intenta obtener directamente el recurso.
     * Muchos streams HLS requieren una reproducción HLS
     * continua y no pueden ser tratados como un archivo.
     *
     * Si el servidor permite CORS y entrega un archivo que
     * FFmpeg pueda leer mediante fetch(), se puede procesar.
     *
     * --------------------------------------------------------
     */

    const response =
      await fetch(
        channel.url,
        {
          cache: 'no-store'
        }
      );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const contentType =
      response.headers.get(
        'content-type'
      ) || '';

    console.log(
      'Content-Type:',
      contentType
    );

    /*
     * Si es un M3U8, mostramos el motivo por el que
     * no lo tratamos como archivo normal.
     */

    if (
      channel.url.includes('.m3u8') ||
      contentType.includes(
        'mpegurl'
      )
    ) {

      showExperimentalHLSMessage();

      return;
    }

    /*
     * Archivo multimedia directo.
     */

    const data =
      await response.arrayBuffer();

    const blob =
      new Blob(
        [data],
        {
          type:
            contentType ||
            'video/mp4'
        }
      );

    const objectURL =
      URL.createObjectURL(blob);

    currentObjectURL =
      objectURL;

    const video =
      document.createElement('video');

    video.controls = true;

    video.autoplay = true;

    video.playsInline = true;

    video.src =
      objectURL;

    playerContainer.innerHTML = '';

    playerContainer.appendChild(
      video
    );

    await video.play();

  } catch (error) {

    console.error(
      'Error FFmpeg/WASM:',
      error
    );

    showError(
      `No se pudo abrir el stream.<br><br>
       ${escapeHTML(error.message)}`
    );

  }

}


/*
 * ============================================================
 * MENSAJE HLS
 * ============================================================
 */

function showExperimentalHLSMessage() {

  playerContainer.innerHTML = `

    <div class="placeholder">

      <div style="font-size:3rem;">
        ⚠️
      </div>

      <h3 style="margin-bottom:1rem;">
        Stream HLS detectado
      </h3>

      <p>
        Este canal utiliza HLS (.m3u8).
      </p>

      <p style="margin-top:1rem;">
        FFmpeg WebAssembly puede procesar
        multimedia dentro del navegador,
        pero no reemplaza directamente
        el motor de reproducción HLS.
      </p>

      <div
        class="status"
        style="margin-top:1rem;"
      >
        ${escapeHTML(
          currentChannel
            ? currentChannel.url
            : ''
        )}
      </div>

    </div>

  `;

}


/*
 * ============================================================
 * ERROR
 * ============================================================
 */

function showError(message) {

  playerContainer.innerHTML = `

    <div class="placeholder">

      <div style="font-size:3rem;">
        ❌
      </div>

      <h3>
        Error de reproducción
      </h3>

      <div
        class="status error"
      >
        ${message}
      </div>

    </div>

  `;

}


/*
 * ============================================================
 * STATUS
 * ============================================================
 */

function setStatus(
  message,
  error = false
) {

  if (!playerStatus) {
    return;
  }

  playerStatus.innerHTML =
    message;

  playerStatus.className =
    error
      ? 'status error'
      : 'status';

}


/*
 * ============================================================
 * DESTRUIR PLAYER
 * ============================================================
 */

function destroyCurrentPlayer() {

  const video =
    playerContainer.querySelector(
      'video'
    );

  if (video) {

    video.pause();

    video.removeAttribute(
      'src'
    );

    video.load();

  }

  if (currentObjectURL) {

    URL.revokeObjectURL(
      currentObjectURL
    );

    currentObjectURL =
      null;

  }

}


/*
 * ============================================================
 * SEGURIDAD HTML
 * ============================================================
 */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/*
 * ============================================================
 * INICIO
 * ============================================================
 */

loadM3UPlaylist();

</script>

</body>
</html>
