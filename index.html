  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    header {
      height: 70px;
      background: #181818;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      display: flex;
      height: calc(100vh - 70px);
    }

    /* SIDEBAR */

    .sidebar {
      width: 340px;
      min-width: 340px;
      background: #181818;
      border-right: 1px solid #292929;
      display: flex;
      flex-direction: column;
    }

    .search {
      padding: 12px;
      border-bottom: 1px solid #292929;
    }

    .search input {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 7px;
      background: #292929;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .search input::placeholder {
      color: #888;
    }

    .channels {
      overflow-y: auto;
      flex: 1;
    }

    .channel {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #222;
      transition: background 0.15s;
    }

    .channel:hover {
      background: #252525;
    }

    .channel.active {
      background: #303030;
    }

    .channel-logo {
      width: 52px;
      height: 38px;
      object-fit: contain;
      background: #222;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .channel-name {
      font-size: 14px;
      line-height: 18px;
    }

    /* PLAYER */

    .main {
      flex: 1;
      background: #000;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .player-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .status {
      position: absolute;
      left: 20px;
      bottom: 20px;
      padding: 9px 14px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      font-size: 13px;
      color: #ddd;
      pointer-events: none;
    }

    .loading {
      color: #aaa;
    }

    .error {
      color: #ff6666;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 250px;
        min-width: 250px;
      }

      .channel-logo {
        width: 42px;
        height: 32px;
      }

      .channel-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📺 Argentina TV</h1>
</header>

<div class="container">

  <aside class="sidebar">

    <div class="search">
      <input
        type="text"
        id="search"
        placeholder="Buscar canal..."
        oninput="filterChannels()"
      >
    </div>

    <div class="channels" id="channels"></div>

  </aside>

  <main class="main">

    <div class="player-container">

        id="video"
        controls
        autoplay
        playsinline
      ></video>

      <div class="status loading" id="status">
        Seleccioná un canal

</div>

  /*

   * ============================================================

  const channelList = document.getElementById("channels");
  const searchInput = document.getElementById("search");
  const video = document.getElementById("video");
  const status = document.getElementById("status");

  let hls = null;
  let currentChannel = null;


  /*
   * ============================================================
   * GENERAR LISTA
   * ============================================================
   */

  function renderChannels(list = channels) {

    channelList.innerHTML = "";

    list.forEach((channel, index) => {

      const item = document.createElement("div");

      item.className = "channel";
      item.dataset.index = index;

      item.innerHTML = `
        <div class="channel-logo">
          <img
            src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(channel.url)}&sz=128"
            class="channel-logo"
            onerror="this.style.display='none'"
          >
        </div>

        <div class="channel-name">
          ${escapeHtml(channel.name)}
        </div>
      `;

      item.onclick = () => {

        document
          .querySelectorAll(".channel")
          .forEach(el => el.classList.remove("active"));

        item.classList.add("active");

        playChannel(channel);

      };

      channelList.appendChild(item);

    });

  }


  /*
   * ============================================================
   * REPRODUCIR CANAL
   * ============================================================
   */

  function playChannel(channel) {

    currentChannel = channel;

    status.className = "status loading";
    status.textContent = "Conectando con " + channel.name + "...";

    if (hls) {

      hls.destroy();
      hls = null;

    }

    video.pause();

    video.removeAttribute("src");
    video.load();


    /*
     * HLS.JS
     */

    if (Hls.isSupported()) {

      hls = new Hls({

        enableWorker: true,

        lowLatencyMode: false,

        backBufferLength: 30,

        maxBufferLength: 30,

        maxMaxBufferLength: 60,

        liveSyncDurationCount: 3,

        liveMaxLatencyDurationCount: 6,

        manifestLoadingTimeOut: 15000,

        manifestLoadingMaxRetry: 6,

        manifestLoadingRetryDelay: 1000,

        levelLoadingTimeOut: 15000,

        levelLoadingMaxRetry: 6,

        levelLoadingRetryDelay: 1000,

        fragLoadingTimeOut: 15000,

        fragLoadingMaxRetry: 6,

        fragLoadingRetryDelay: 1000

      });


      hls.loadSource(channel.url);

      hls.attachMedia(video);


      hls.on(Hls.Events.MANIFEST_PARSED, function() {

        status.textContent = channel.name;

        video.play().catch(() => {});

      });


      hls.on(Hls.Events.FRAG_LOADED, function() {

        status.textContent = channel.name;

      });


      hls.on(Hls.Events.ERROR, function(event, data) {

        console.log("HLS:", data);

        if (data.fatal) {

          status.className = "status error";

          status.textContent = "Error de reproducción. Reintentando...";

          reconnect();

        }

      });

    }


    /*
     * HLS NATIVO
     * Safari / algunos navegadores
     */

    else if (video.canPlayType("application/vnd.apple.mpegurl")) {

      video.src = channel.url;

      video.addEventListener(
        "loadedmetadata",
        function() {

          status.textContent = channel.name;

          video.play().catch(() => {});

        },
        { once: true }
      );

    }

    else {

      status.className = "status error";

      status.textContent =
        "Este navegador no soporta reproducción HLS.";

    }

  }


  /*
   * ============================================================
   * RECONEXIÓN
   * ============================================================
   */

  let reconnectTimer = null;
  let reconnectAttempts = 0;

  function reconnect() {

    if (!currentChannel) {
      return;
    }

    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
    }

    reconnectAttempts++;

    const delay = Math.min(
      15000,
      2000 * reconnectAttempts
    );

    status.className = "status loading";

    status.textContent =
      "Reintentando " +
      currentChannel.name +
      " en " +
      Math.ceil(delay / 1000) +
      " segundos...";

    reconnectTimer = setTimeout(() => {

      playChannel(currentChannel);

    }, delay);

  }


  /*
   * ============================================================
   * DETECTAR STALL
   * ============================================================
   */

  let lastCurrentTime = 0;
  let lastProgressTime = Date.now();

  setInterval(() => {

    if (!currentChannel || video.paused) {
      return;
    }

    const currentTime = video.currentTime;

    if (
      currentTime > 0 &&
      currentTime !== lastCurrentTime
    ) {

      lastCurrentTime = currentTime;
      lastProgressTime = Date.now();

      reconnectAttempts = 0;

      if (
        status.classList.contains("loading")
      ) {

        status.className = "status";
        status.textContent = currentChannel.name;

      }

    }

    else if (
      Date.now() - lastProgressTime > 15000
    ) {

      console.log("Video detenido. Reconectando...");

      lastProgressTime = Date.now();

      reconnect();

    }

  }, 3000);


  /*
   * ============================================================
   * BUSCADOR
   * ============================================================
   */

  function filterChannels() {

    const text =
      searchInput.value
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    const filtered = channels.filter(channel => {

      const name =
        channel.name
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");

      return name.includes(text);

    });

    renderChannels(filtered);

  }


  /*
   * ============================================================
   * ESCAPAR HTML
   * ============================================================
   */

  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  /*
   * ============================================================
   * INICIO
   * ============================================================
   */

  renderChannels();

</script>

</body>
</html>
