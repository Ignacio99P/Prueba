<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argentina TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      height: 70px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }

    .search-box {
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-dark);
      color: var(--text-main);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-list::-webkit-scrollbar {
      width: 6px;
    }

    .channel-list::-webkit-scrollbar-track {
      background: var(--bg-card);
    }

    .channel-list::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 3px;
    }

    .channel-list::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    .channel-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: background 0.2s;
    }

    .channel-item:hover,
    .channel-item.active {
      background-color: var(--bg-hover);
    }

    .channel-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .channel-icon {
      width: 30px;
      text-align: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
      height: 100%;
      overflow: hidden;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .stream-info {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .stream-info h2 {
      font-size: 1rem;
    }

    .channel-count {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    @media (max-width: 768px) {
      html, body {
        overflow: auto;
      }

      .container {
        flex-direction: column-reverse;
        height: auto;
        overflow: visible;
      }

      .sidebar {
        width: 100%;
        height: 50vh;
      }

      .main-content {
        height: 50vh;
        position: sticky;
        top: 0;
        z-index: 10;
      }
    }
  </style>
</head>

    let hlsInstance = null;

    function renderChannels() {
      const listElement = document.getElementById('channelList');
      const searchTerm = document.getElementById('searchInput').value
        .toLowerCase()
        .trim();

      listElement.innerHTML = '';

      const filtered = channels.filter(channel =>
        channel.name.toLowerCase().includes(searchTerm)
      );

      document.getElementById('channelCount').textContent =
        `${filtered.length} canal${filtered.length === 1 ? '' : 'es'}`;

      if (filtered.length === 0) {
        listElement.innerHTML =
          '<li class="placeholder">No hay canales disponibles.</li>';
        return;
      }

      filtered.forEach(channel => {
        const li = document.createElement('li');
        li.className = 'channel-item';

        const icon = document.createElement('span');
        icon.className = 'channel-icon';
        icon.textContent = '📺';

        const name = document.createElement('span');
        name.className = 'channel-name';
        name.textContent = channel.name;

        li.appendChild(icon);
        li.appendChild(name);

        li.onclick = () => playChannel(channel, li);
        listElement.appendChild(li);
      });
    }

    function filterChannels() {
      renderChannels();
    }

    function playChannel(channel, element) {
      document
        .querySelectorAll('.channel-item')
        .forEach(item => item.classList.remove('active'));

      if (element) {
        element.classList.add('active');
      }

      document.getElementById('currentChannelName').textContent =
        channel.name;

      const container = document.getElementById('playerContainer');

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      container.innerHTML = '';

      const video = document.createElement('video');
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;

      container.appendChild(video);

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });

        hlsInstance.loadSource(channel.url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error('Error HLS:', data);

            container.innerHTML = `
              <div class="placeholder">
                No se pudo reproducir <strong>${channel.name}</strong>.<br>
                <small>El enlace puede estar caído, bloqueado o haber expirado.</small>
              </div>
            `;
          }
        });
      }
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;

        video.addEventListener('error', () => {
          container.innerHTML = `
            <div class="placeholder">
              No se pudo reproducir <strong>${channel.name}</strong>.
            </div>
          `;
        });

        video.play().catch(() => {});
      }
      else {
        container.innerHTML = `
          <div class="placeholder">
            Este navegador no soporta reproducción HLS.
          </div>
        `;
      }
    }

    // Carga inicial
    renderChannels();
