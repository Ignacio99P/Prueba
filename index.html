<!DOCTYPE html>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

header {

<body>

<header>
    <h1>📺 Argentina TV</h1>
    <div id="estado">Esperando canal...</div>
</header>

<div class="contenedor">

    <aside class="sidebar">

        <div class="busqueda">
            <input
                type="text"
                id="buscar"
                placeholder="Buscar canal..."
                autocomplete="off">
        </div>

        <div id="listaCanales" class="lista"></div>

    </aside>

    <main class="principal">

        <div class="video-container">

            <video
                id="video"
                controls
                playsinline
                autoplay>
            </video>

        </div>

        <div class="controles">

            <button onclick="reintentar()">
                🔄 Reconectar
            </button>

            <button onclick="pantallaCompleta()">
                ⛶ Pantalla completa
            </button>

            <div id="diagnostico">
                -
            </div>

        </div>

        <div class="info">

            <h2 id="canalActual">
                Seleccioná un canal
            </h2>

            <div id="mensaje">
                Esperando reproducción...
            </div>

        </div>

    </main>

</div>

<script>

/*
==========================================================
 CONFIGURACIÓN
==========================================================
*/

const CANALES = [

    {
        nombre: "HBO2",
        url: "http://200.62.239.170:830/play/a08c/index.m3u8"
    },

    {
        nombre: "A&E",
        url: "http://200.62.239.170:830/play/a00p/index.m3u8"
    }

    /*
    AGREGÁ ACÁ EL RESTO DE LOS CANALES.

    Ejemplo:

    {
        nombre: "TNT",
        url: "http://200.62.239.170:830/play/XXXX/index.m3u8"
    },

    */

];


/*
==========================================================
 VARIABLES
==========================================================
*/

const video = document.getElementById("video");
const lista = document.getElementById("listaCanales");
const estado = document.getElementById("estado");
const mensaje = document.getElementById("mensaje");
const canalActual = document.getElementById("canalActual");
const diagnostico = document.getElementById("diagnostico");
const buscar = document.getElementById("buscar");

let hls = null;
let canalSeleccionado = null;

let intentos = 0;
let timerReconexion = null;
let timerWatchdog = null;

let ultimaActividad = Date.now();
let reproduciendo = false;

const MAX_REINTENTOS = 20;


/*
==========================================================
 LISTA DE CANALES
==========================================================
*/

function mostrarCanales(filtro = "") {

    lista.innerHTML = "";

    const texto = filtro.toLowerCase();

    CANALES
        .filter(canal =>
            canal.nombre.toLowerCase().includes(texto)
        )
        .forEach(canal => {

            const elemento = document.createElement("div");

            elemento.className = "canal";

            if (canal === canalSeleccionado) {
                elemento.classList.add("activo");
            }

            elemento.innerHTML = `
                <div class="canal-nombre">
                    ${escapeHTML(canal.nombre)}
                </div>

                <div class="canal-estado">
                    HLS
                </div>
            `;

            elemento.onclick = () => seleccionarCanal(canal);

            lista.appendChild(elemento);

        });
}


/*
==========================================================
 ESCAPAR HTML
==========================================================
*/

function escapeHTML(texto) {

    return texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
==========================================================
 SELECCIONAR CANAL
==========================================================
*/

function seleccionarCanal(canal) {

    canalSeleccionado = canal;

    intentos = 0;

    mostrarCanales();

    canalActual.textContent = canal.nombre;

    iniciarReproduccion(canal.url);

}


/*
==========================================================
 INICIAR REPRODUCCIÓN
==========================================================
*/

function iniciarReproduccion(url) {

    detenerHLS();

    limpiarTimers();

    reproduciendo = false;

    estado.textContent = "Conectando...";
    estado.style.color = "#aaa";

    mensaje.textContent =
        "Conectando con el servidor de video...";

    diagnostico.textContent =
        "Intento " + (intentos + 1);

    /*
    ------------------------------------------------------
    HLS.JS
    ------------------------------------------------------
    */

    if (Hls.isSupported()) {

        hls = new Hls({

            /*
            Mantener un buffer razonable.
            */

            maxBufferLength: 30,

            maxMaxBufferLength: 60,

            backBufferLength: 15,

            /*
            No esperar demasiado ante segmentos perdidos.
            */

            maxBufferHole: 0.5,

            /*
            Reintentos.
            */

            manifestLoadingMaxRetry: 3,

            levelLoadingMaxRetry: 3,

            fragLoadingMaxRetry: 3,

            manifestLoadingRetryDelay: 1000,

            levelLoadingRetryDelay: 1000,

            fragLoadingRetryDelay: 1000,

            /*
            Timeout razonable para servidores lentos.
            */

            manifestLoadingTimeOut: 10000,

            levelLoadingTimeOut: 10000,

            fragLoadingTimeOut: 10000,

            /*
            Permitimos cierta tolerancia.
            */

            liveSyncDurationCount: 3,

            liveMaxLatencyDurationCount: 8,

            /*
            Evita acumular demasiada latencia.
            */

            highBufferWatchdogPeriod: 2,

            nudgeOffset: 0.2,

            nudgeMaxRetry: 5

        });


        hls.attachMedia(video);


        hls.on(Hls.Events.MEDIA_ATTACHED, function() {

            console.log("Media attached");

            hls.loadSource(url);

        });


        hls.on(Hls.Events.MANIFEST_PARSED, function() {

            console.log("Manifest cargado");

            estado.textContent = "Conectado";
            estado.style.color = "#4caf50";

            mensaje.textContent =
                "Reproduciendo...";

            intentarPlay();

        });


        /*
        --------------------------------------------------
        FRAGMENTO CARGADO
        --------------------------------------------------
        */

        hls.on(Hls.Events.FRAG_LOADED, function() {

            ultimaActividad = Date.now();

            diagnostico.textContent =
                "Streaming activo";

            if (!reproduciendo) {

                reproduciendo = true;

                estado.textContent = "Reproduciendo";
                estado.style.color = "#4caf50";

            }

        });


        /*
        --------------------------------------------------
        ERROR HLS
        --------------------------------------------------
        */

        hls.on(Hls.Events.ERROR, function(event, data) {

            console.warn("HLS ERROR:", data);

            diagnostico.textContent =
                data.details || data.type || "Error HLS";


            /*
            ERROR RECUPERABLE
            */

            if (!data.fatal) {

                /*
                Si se perdió un fragmento,
                dejamos que HLS intente recuperarlo.
                */

                if (
                    data.details ===
                    Hls.ErrorDetails.FRAG_LOAD_ERROR ||
                    data.details ===
                    Hls.ErrorDetails.FRAG_LOAD_TIMEOUT
                ) {

                    mensaje.textContent =
                        "Reintentando segmento...";

                }

                return;
            }


            /*
            ERROR FATAL
            */

            if (
                data.type ===
                Hls.ErrorTypes.MEDIA_ERROR
            ) {

                mensaje.textContent =
                    "Recuperando reproducción...";

                try {

                    hls.recoverMediaError();

                    return;

                } catch (e) {

                    console.warn(e);

                }

            }


            /*
            ERROR DE RED / MANIFEST
            */

            if (
                data.type ===
                Hls.ErrorTypes.NETWORK_ERROR
            ) {

                programarReconexion();

                return;

            }


            /*
            CUALQUIER OTRO ERROR
            */

            programarReconexion();

        });


    }

    /*
    ======================================================
    SAFARI / HLS NATIVO
    ======================================================
    */

    else if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = url;

        video.addEventListener(
            "loadedmetadata",
            intentarPlay,
            { once: true }
        );

        estado.textContent = "HLS nativo";

    }

    else {

        estado.textContent = "No compatible";

        mensaje.textContent =
            "Este navegador no soporta reproducción HLS.";

    }


    iniciarWatchdog();

}


/*
==========================================================
 PLAY
==========================================================
*/

function intentarPlay() {

    video.play()
        .then(() => {

            reproduciendo = true;

            estado.textContent = "Reproduciendo";
            estado.style.color = "#4caf50";

            mensaje.textContent =
                "Reproduciendo correctamente.";

        })
        .catch(error => {

            console.warn(
                "Autoplay bloqueado:",
                error
            );

            mensaje.textContent =
                "Presioná Play para comenzar.";

        });

}


/*
==========================================================
 RECONEXIÓN
==========================================================
*/

function programarReconexion() {

    if (timerReconexion) {
        return;
    }

    intentos++;

    if (intentos > MAX_REINTENTOS) {

        estado.textContent =
            "No se pudo conectar";

        estado.style.color = "#f44336";

        mensaje.textContent =
            "El servidor no respondió después de varios intentos.";

        diagnostico.textContent =
            "Reintentos agotados";

        return;

    }

    estado.textContent =
        "Reconectando...";

    estado.style.color = "#ff9800";

    mensaje.textContent =
        "Se perdió la conexión. Reintentando...";

    diagnostico.textContent =
        "Reintento " + intentos;


    /*
    Esperamos cada vez un poco más,
    pero sin hacer esperas enormes.
    */

    const espera =
        Math.min(
            1000 * Math.pow(1.4, intentos - 1),
            10000
        );


    timerReconexion = setTimeout(() => {

        timerReconexion = null;

        if (canalSeleccionado) {

            iniciarReproduccion(
                canalSeleccionado.url
            );

        }

    }, espera);

}


/*
==========================================================
 WATCHDOG
==========================================================

Comprueba si el video dejó de avanzar.

Esto es importante con servidores que continúan
entregando el manifest pero dejan de entregar segmentos.
==========================================================
*/

function iniciarWatchdog() {

    limpiarWatchdog();

    timerWatchdog = setInterval(() => {

        if (!canalSeleccionado) {
            return;
        }

        const ahora = Date.now();

        /*
        Si el video está pausado manualmente,
        no hacemos nada.
        */

        if (video.paused) {
            return;
        }


        /*
        Si hace más de 15 segundos que no recibimos
        actividad HLS, intentamos recuperar.
        */

        if (
            reproduciendo &&
            ahora - ultimaActividad > 15000
        ) {

            console.warn(
                "Watchdog: stream detenido"
            );

            mensaje.textContent =
                "El stream parece detenido. Recuperando...";

            ultimaActividad = ahora;

            if (hls) {

                try {

                    hls.stopLoad();
                    hls.startLoad();

                } catch (e) {

                    console.warn(e);

                    programarReconexion();

                }

            }

        }

    }, 5000);

}


/*
==========================================================
 REINTENTAR MANUALMENTE
==========================================================
*/

function reintentar() {

    intentos = 0;

    if (canalSeleccionado) {

        iniciarReproduccion(
            canalSeleccionado.url
        );

    }

}


/*
==========================================================
 DETENER HLS
==========================================================
*/

function detenerHLS() {

    if (hls) {

        try {

            hls.destroy();

        } catch (e) {

            console.warn(e);

        }

        hls = null;

    }

}


/*
==========================================================
 TIMERS
==========================================================
*/

function limpiarWatchdog() {

    if (timerWatchdog) {

        clearInterval(timerWatchdog);

        timerWatchdog = null;

    }

}


function limpiarTimers() {

    if (timerReconexion) {

        clearTimeout(timerReconexion);

        timerReconexion = null;

    }

    limpiarWatchdog();

}


/*
==========================================================
 PANTALLA COMPLETA
==========================================================
*/

function pantallaCompleta() {

    const contenedor =
        document.querySelector(".video-container");

    if (document.fullscreenElement) {

        document.exitFullscreen();

    } else {

        contenedor.requestFullscreen();

    }

}


/*
==========================================================
 EVENTOS DEL VIDEO
==========================================================
*/

video.addEventListener("playing", function() {

    reproduciendo = true;

    ultimaActividad = Date.now();

    estado.textContent =
        "Reproduciendo";

    estado.style.color =
        "#4caf50";

});


video.addEventListener("timeupdate", function() {

    ultimaActividad = Date.now();

});


video.addEventListener("waiting", function() {

    estado.textContent =
        "Buffering...";

    estado.style.color =
        "#ff9800";

});


video.addEventListener("stalled", function() {

    console.warn("Video stalled");

    mensaje.textContent =
        "El video se detuvo. Intentando recuperar...";

});


video.addEventListener("error", function() {

    console.warn(
        "VIDEO ERROR",
        video.error
    );

});


/*
==========================================================
 BUSCADOR
==========================================================
*/

buscar.addEventListener("input", function() {

    mostrarCanales(this.value);

});


/*
==========================================================
 INICIO
==========================================================
*/

mostrarCanales();

</script>

</body>
</html>
