<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argentina TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
    }

    .search-box {
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-dark);
      color: var(--text-main);
      outline: none;
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      width: 320px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .filter-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      flex: 1;
      padding: 0.75rem 0.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      border-bottom: 2px solid transparent;
    }

    .filter-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-item:hover, .channel-item.active {
      background-color: var(--bg-hover);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
    }

    .player-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
    }

    .placeholder {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .stream-info {
      background-color: var(--bg-card);
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .open-btn {
      background-color: var(--primary);
      color: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .container { flex-direction: column-reverse; height: auto; }
      .sidebar { width: 100%; height: 350px; }
      .player-container { height: 56.25vw; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🇦🇷 Argentina TV</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="setCategory('ALL', this)">TODOS</button>
        <button class="filter-btn" onclick="setCategory('TDA', this)">NACIONALES / TDA</button>
        <button class="filter-btn" onclick="setCategory('BSAS', this)">BUENOS AIRES</button>
      </div>
      <ul class="channel-list" id="channelList"></ul>
    </aside>

    <main class="main-content">
      <div class="player-container" id="playerContainer">
        <div class="placeholder">Seleccioná un canal de la lista para empezar a ver.</div>
      </div>
      <div class="stream-info">
        <h2 id="currentChannelName">Ningún canal seleccionado</h2>
        <a id="externalLink" href="#" target="_blank" class="open-btn" style="display:none;">Ver en YT / Web Oficial ↗</a>
      </div>
    </main>
  </div>

  <script>
    // Canales configurados con sus streams HLS (.m3u8) directos públicos
    const channels = [
      { name: "TN Todo Noticias", stream: "https://live-tn.artear.com/live/tn/playlist.m3u8", yt: "https://www.youtube.com/user/todonoticias", group: "TDA" },
      { name: "Televisión Pública", stream: "https://live-tvp.cdn.ba.gov.ar/hls/live.m3u8", yt: "https://www.youtube.com/user/TVPublicaArgentina", group: "TDA" },
      { name: "Canal 26", stream: "https://live-canal26.agilecontent.com/hls/live/canal26/playlist.m3u8", yt: "https://www.youtube.com/user/canal26", group: "TDA" },
      { name: "C5N", stream: "https://live-c5n.agilecontent.com/hls/live/c5n/playlist.m3u8", yt: "https://www.youtube.com/c/c5n", group: "TDA" },
      { name: "Crónica TV", stream: "https://live-cronica.agilecontent.com/hls/live/cronica/playlist.m3u8", yt: "https://www.youtube.com/c/cronicatv", group: "TDA" },
      { name: "IP Noticias", stream: "https://ip.agilecontent.com/hls/live/ip/playlist.m3u8", yt: "https://www.youtube.com/c/IPNoticias", group: "TDA" },
      { name: "LN+", stream: "https://live-ln.agilecontent.com/hls/live/ln/playlist.m3u8", yt: "https://www.youtube.com/c/LaNacionPlus", group: "TDA" },
      { name: "Encuentro", stream: "", yt: "https://www.youtube.com/user/canalencuentro/live", group: "TDA" },
      { name: "Pakapaka", stream: "", yt: "https://www.youtube.com/user/CanalPakapaka/live", group: "TDA" },
      { name: "Telemax", stream: "https://stream.telecentro.com.ar/hls/telemax/index.m3u8", yt: "https://www.telemax.com.ar", group: "BSAS" },
      { name: "El Trece", stream: "https://live-eltrece.artear.com/live/eltrece/playlist.m3u8", yt: "https://www.eltrece.tv/vivo", group: "BSAS" },
      { name: "Telefe", stream: "", yt: "https://www.youtube.com/user/telefe/live", group: "BSAS" },
      { name: "América TV", stream: "", yt: "https://www.youtube.com/user/americatv/live", group: "BSAS" },
      { name: "A24", stream: "", yt: "https://www.youtube.com/user/a24com/live", group: "BSAS" }
    ];

    let currentCategory = 'ALL';
    let hlsInstance = null;

    function renderChannels() {
      const listElement = document.getElementById('channelList');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      listElement.innerHTML = '';

      const filtered = channels.filter(channel => {
        const matchesCategory = currentCategory === 'ALL' || channel.group === currentCategory;
        const matchesSearch = channel.name.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      filtered.forEach(channel => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        li.innerHTML = `<span class="channel-name">📺 ${channel.name}</span>`;
        li.onclick = () => playChannel(channel, li);
        listElement.appendChild(li);
      });
    }

    function setCategory(category, button) {
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      renderChannels();
    }

    function filterChannels() {
      renderChannels();
    }

    function playChannel(channel, element) {
      document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
      if (element) element.classList.add('active');

      document.getElementById('currentChannelName').textContent = channel.name;
      const externalBtn = document.getElementById('externalLink');
      externalBtn.style.display = 'inline-block';
      externalBtn.href = channel.yt;

      const container = document.getElementById('playerContainer');
      container.innerHTML = '';

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (channel.stream) {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        container.appendChild(video);

        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(channel.stream);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
          hlsInstance.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              container.innerHTML = `<div class="placeholder"><p>El stream directo de ${channel.name} no está respondiendo en este momento.</p><br><a href="${channel.yt}" target="_blank" class="open-btn">Abrir señal oficial ↗</a></div>`;
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = channel.stream;
          video.play();
        }
      } else {
        // Para canales que no emiten HLS abierto y bloquean reproductores externos (YouTube Embed restringido)
        container.innerHTML = `
          <div class="placeholder">
            <p>Este canal exige reproductor propio o bloquea emisión en sitios externos.</p><br>
            <a href="${channel.yt}" target="_blank" class="open-btn">Abrir vivo de ${channel.name} en ventana nueva ↗</a>
          </div>`;
      }
    }

    renderChannels();
  </script>
</body>
</html>
